<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bimbo</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-image: url('https://images.unsplash.com/photo-1560184897-85b9a5b97f29'); /* Brick wall texture */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #f2f2f2;
      text-align: center;
    }

    header {
      background: rgba(0, 0, 0, 0.6);
      padding: 3rem 1rem;
    }

    header h1 {
      font-size: 3rem;
      margin: 0;
      letter-spacing: 2px;
    }

    main {
      background: rgba(0, 0, 0, 0.7);
      max-width: 700px;
      margin: 2rem auto;
      padding: 2rem;
      border-radius: 12px;
    }

    .poem {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .poem h2 {
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    .poem p {
      white-space: pre-line;
      line-height: 1.6;
    }

    footer {
      padding: 1rem;
      background: rgba(0, 0, 0, 0.6);
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bimbo</h1>
    <p>Poems and reflections</p>
  </header>

  <main>
    <section class="poem">
      <h2>Untitled</h2>
      <p>
        Your first poem goes here.
        Add your lines.
        The wall remembers.
      </p>
    </section>
  </main>

  <footer>
    © 2025 Bimbo | Built with love and bricks
  </footer>
</body>
</html>
